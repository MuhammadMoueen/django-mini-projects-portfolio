{% extends 'base.html' %}

{% block title %}Login - Finance Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-background">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>
    
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-animated">
                <span class="logo-icon">💰</span>
                <h1>Finance<span>Tracker</span></h1>
            </div>
            <h2 class="auth-title">WELCOME BACK!</h2>
            <p class="auth-subtitle">Please login to your account</p>
        </div>
        
        <form id="loginForm" class="auth-form">
            {% csrf_token %}
            <div class="form-group">
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
            </div>
            
            <div class="form-group">
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
            </div>
            
            <div class="form-footer">
                <a href="#" class="forgot-link">Forgot Password?</a>
            </div>
            
            <button type="submit" class="btn btn-submit">
                <span class="btn-text">Submit</span>
                <span class="btn-arrow">→</span>
            </button>
        </form>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="/signup/" class="signup-link">SignUp</a></p>
        </div>
    </div>
</div>

<script>
// Get CSRF token from cookie
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    
    // Remove CSRF token from data object
    delete data.csrfmiddlewaretoken;
    
    try {
        const csrftoken = getCookie('csrftoken');
        const response = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrftoken,
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('user', JSON.stringify(result.user));
            showAlert('Login successful!', 'success');
            setTimeout(() => window.location.href = '/dashboard/', 1000);
        } else {
            let errorMsg = 'Login failed';
            if (result.error) {
                errorMsg = result.error;
            } else if (result.errors) {
                const errors = [];
                for (const [field, messages] of Object.entries(result.errors)) {
                    if (Array.isArray(messages)) {
                        errors.push(...messages);
                    } else {
                        errors.push(messages);
                    }
                }
                errorMsg = errors.join(', ');
            } else if (result.message) {
                errorMsg = result.message;
            }
            showAlert(errorMsg, 'error');
        }
    } catch (error) {
        console.error('Error:', error);
        showAlert('Network error. Please try again.', 'error');
    } finally {
        // Reset button state
        const submitBtn = document.querySelector('button[type="submit"]');
        if (submitBtn) {
            submitBtn.innerHTML = '<span class="btn-text">Submit</span><span class="btn-arrow">→</span>';
            submitBtn.disabled = false;
        }
    }
});
</script>
{% endblock %}
