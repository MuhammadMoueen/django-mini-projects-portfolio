{% extends 'base.html' %}

{% block title %}Sign Up - Finance Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="logo" style="text-align: center; margin-bottom: 30px;">
            Finance<span>Tracker</span>
        </div>
        <h2 class="auth-title">Create Account</h2>
        
        <form id="signupForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control">
            </div>
            
            <div class="form-group">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control">
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" minlength="8" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Confirm Password</label>
                <input type="password" name="password2" class="form-control" minlength="8" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                Create Account
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: var(--gray-600);">
            Already have an account? <a href="/login/" style="color: var(--black); font-weight: 600;">Login</a>
        </p>
    </div>
</div>

<script>
document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    
    if (data.password !== data.password2) {
        showAlert('Passwords do not match', 'error');
        return;
    }
    
    try {
        const response = await fetch('/api/auth/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('user', JSON.stringify(result.user));
            showAlert('Account created successfully!', 'success');
            setTimeout(() => window.location.href = '/dashboard/', 1000);
        } else {
            const errorMsg = Object.values(result).flat().join(', ');
            showAlert(errorMsg || 'Registration failed', 'error');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'error');
    }
});
</script>
{% endblock %}
