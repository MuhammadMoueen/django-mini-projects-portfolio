{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Finance Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=3.0">
    <link rel="stylesheet" href="{% static 'css/inline-extracted.css' %}?v=3.0">
    <link rel="stylesheet" href="{% static 'css/charts.css' %}?v=3.0">
    <link rel="stylesheet" href="{% static 'css/polish.css' %}?v=3.0">
    <link rel="stylesheet" href="{% static 'css/responsive.css' %}?v=3.0">
    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block content %}{% endblock %}
    <script src="{% static 'js/main.js' %}?v=2.0"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
