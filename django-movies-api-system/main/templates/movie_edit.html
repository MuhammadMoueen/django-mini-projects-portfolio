{% extends 'base.html' %}
{% load static %}

{% block title %}Edit Movie - Movies Database{% endblock %}

{% block content %}
<div class="container py-4">
  <h1>Edit Movie</h1>
  <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label for="title">Title</label>
      <input id="title" name="title" class="form-control" value="{{ movie.title }}" required>
    </div>
    <div class="mb-3">
      <label for="description">Description</label>
      <textarea id="description" name="description" class="form-control">{{ movie.description }}</textarea>
    </div>
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="duration">Duration (minutes)</label>
        <input id="duration" name="duration" type="number" class="form-control" value="{{ movie.duration }}" required>
      </div>
      <div class="col-md-4 mb-3">
        <label for="release_date">Release Date</label>
        <input id="release_date" name="release_date" type="date" class="form-control" value="{{ movie.release_date|date:'Y-m-d' }}" required>
      </div>
      <div class="col-md-4 mb-3">
        <label for="rating">Rating</label>
        <input id="rating" name="rating" type="number" step="0.1" class="form-control" value="{{ movie.rating|default:'' }}">
      </div>
    </div>

    <div class="mb-3">
      <label for="genre">Genre</label>
      <select id="genre" name="genre" class="form-control">
        <option value="">-- Select Genre --</option>
        {% for genre in genres %}
          <option value="{{ genre.id }}" {% if movie.genre and movie.genre.id == genre.id %}selected{% endif %}>{{ genre.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="language">Language</label>
      <select id="language" name="language" class="form-control">
        <option value="">-- Select Language --</option>
        {% for language in languages %}
          <option value="{{ language.id }}" {% if movie.language and movie.language.id == language.id %}selected{% endif %}>{{ language.name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="actors">Actors</label>
      <select id="actors" name="actors" class="form-control" multiple>
        {% for actor in actors %}
          <option value="{{ actor.id }}" {% if actor in movie.actors.all %}selected{% endif %}>{{ actor.first_name }} {{ actor.last_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="poster_image">Poster</label>
      <input id="poster_image" name="poster_image" type="file" accept="image/*" class="form-control">
      {% if movie.poster_image %}
        <div class="mt-2"><img src="{{ movie.poster_image.url }}" class="poster-preview" /></div>
      {% endif %}
    </div>

    <button class="btn btn-primary" type="submit">Update</button>
    <a class="btn btn-secondary" href="{% url 'movie_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
