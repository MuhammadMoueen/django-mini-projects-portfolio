{% extends 'base.html' %}
{% load static %}

{% block title %}Movies - Movies Database{% endblock %}

{% block content %}
{% csrf_token %}
<div class="movies-header">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <h1 class="mb-2"><i class="fas fa-film"></i> Movies Collection</h1>
                <p class="mb-0 opacity-75">Browse and manage your movie database</p>
            </div>
            <a href="{% url 'movie_create' %}" class="btn btn-light btn-lg">
                <i class="fas fa-plus"></i> Add Movie
            </a>
        </div>
    </div>
</div>

<div class="container mb-5">
    <div class="row mb-4">
        <div class="col-md-8">
            <div class="input-group">
                <span class="input-group-text bg-white">
                    <i class="fas fa-search"></i>
                </span>
                <input type="text" 
                       id="search-input" 
                       class="form-control" 
                       placeholder="Search movies by title or description..."
                       autocomplete="off">
                <button class="btn btn-outline-secondary" type="button" id="clear-search">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <select id="sort-select" class="form-select">
                <option value="-release_date">Newest First</option>
                <option value="release_date">Oldest First</option>
                <option value="title">Title (A-Z)</option>
                <option value="-title">Title (Z-A)</option>
                <option value="-rating">Highest Rated</option>
                <option value="rating">Lowest Rated</option>
            </select>
        </div>
    </div>
    
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3 text-muted">Loading movies...</p>
    </div>
    
    <div id="error-message" class="alert alert-danger" style="display: none;"></div>
    
    <div id="movies-container" class="row g-4"></div>
    
    <div id="pagination"></div>
</div>

<script src="{% static 'js/api-movies.js' %}"></script>
{% endblock %}
