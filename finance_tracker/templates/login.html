{% extends 'base.html' %}

{% block title %}Login - Finance Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="logo" style="text-align: center; margin-bottom: 30px;">
            Finance<span>Tracker</span>
        </div>
        <h2 class="auth-title">Welcome Back</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px;">
                Login
            </button>
        </form>
        
        <p style="text-align: center; margin-top: 20px; color: var(--gray-600);">
            Don't have an account? <a href="/signup/" style="color: var(--black); font-weight: 600;">Sign Up</a>
        </p>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = Object.fromEntries(formData);
    
    try {
        const response = await fetch('/api/auth/login/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        if (response.ok) {
            localStorage.setItem('token', result.token);
            localStorage.setItem('user', JSON.stringify(result.user));
            showAlert('Login successful!', 'success');
            setTimeout(() => window.location.href = '/dashboard/', 1000);
        } else {
            showAlert(result.error || 'Login failed', 'error');
        }
    } catch (error) {
        showAlert('Network error. Please try again.', 'error');
    }
});
</script>
{% endblock %}
